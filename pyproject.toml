[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pl-hot"
version = "0.1.0"
description = "Reusable parking-lot segmentation helpers for HOT fAIr model onboarding."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "shapely>=2.0",
]

[project.optional-dependencies]
train = [
    "onnx>=1.17",
    "onnxscript>=0.1",
    "torch>=2.2",
    "transformers>=4.41",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/pl_hot"]
